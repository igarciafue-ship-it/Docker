# Reverse proxy: recibe todo el tráfico y lo reparte entre los servicios
# Adaptado de 2SM-erronka-1 para examen B

# Resolver para DNS interno de Docker
resolver 127.0.0.11 valid=10s ipv6=off;

# Configuración global de proxy
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
client_max_body_size 50m;

# Timeouts
proxy_connect_timeout 60s;
proxy_send_timeout 60s;
proxy_read_timeout 60s;

# Servidor HTTP principal
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Deshabilitar absolute redirects de los backends
    absolute_redirect off;

    # Proxy a web (root)
    location / {
        proxy_pass http://web:80;
    }

    # Proxy a quien con prefix removal
    location /quien/ {
        proxy_pass http://quien:80/;
    }
}

# Servidor para archivos.localhost
server {
    listen 80;
    listen [::]:80;
    server_name archivos.localhost;

    absolute_redirect off;

    # Proxy a archivos
    location / {
        proxy_pass http://archivos:80;
    }
}
