# Examen Docker · Bloque B
# Reverse proxy con servicios

services:

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "${PUERTO_PROXY}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
      - quien
      - archivos
    networks:
      - examen_network

  web:
    image: httpd:2.4
    container_name: web
    volumes:
      - ./compartida:/usr/local/apache2/htdocs:ro
    networks:
      - examen_network

  quien:
    image: traefik/whoami:latest
    container_name: quien
    environment:
      WHOAMI_NAME: alumno3
    networks:
      - examen_network

  archivos:
    image: filebrowser/filebrowser:v2.23.0
    container_name: archivos
    volumes:
      - ./compartida:/srv
    networks:
      - examen_network

  # ── No toques este servicio: es el corrector del examen ─────────────────────
  corrector:
    image: python:3.12-alpine
    profiles: ["corrector"]
    command: python /examen/corrector/corregir.py
    volumes:
      - ./:/examen:ro
      - /var/run/docker.sock:/var/run/docker.sock
  # ─────────────────────────────────────────────────────────────────────────────

networks:
  examen_network:
    driver: bridge
